[project]
name = "jot"
version = "0.1.0"
description = "Timestamped YouTube transcripts, opt-in OpenRouter watch-value evaluations, and portable watch pages."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "jot_assets/Libron-LICENSE.txt", "jot_assets/Flexoki-LICENSE.txt"]
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2024.0.0",
    "assemblyai>=0.35.0",
    "markdown-it-py>=3.0.0",
]

[project.scripts]
jot = "jot:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "jot.py",
    "jot_html.py",
    "jot_assets/Libron-Regular.woff2",
    "jot_assets/Libron-Bold.woff2",
    "jot_assets/Libron-Italic.woff2",
    "jot_assets/Libron-BoldItalic.woff2",
    "jot_assets/Libron-LICENSE.txt",
    "jot_assets/Flexoki-LICENSE.txt",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "jot.py",
    "jot_html.py",
    "jot_assets/Libron-Regular.woff2",
    "jot_assets/Libron-Bold.woff2",
    "jot_assets/Libron-Italic.woff2",
    "jot_assets/Libron-BoldItalic.woff2",
    "jot_assets/Libron-LICENSE.txt",
    "jot_assets/Flexoki-LICENSE.txt",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "uv.lock",
    ".env.example",
    ".gitignore",
    "tests",
]
exclude = ["**/__pycache__/**", "**/*.py[cod]", "**/.DS_Store"]
