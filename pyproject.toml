[project]
name = "jot"
version = "0.1.0"
description = "Source content from anywhere — search free PDFs and transcribe YouTube videos to clean markdown."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pymupdf>=1.24.0",
    "thefuzz>=0.22.0",
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2024.0.0",
    "assemblyai>=0.35.0",
    "anthropic>=0.42.0",
]

[project.scripts]
jot = "jot:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["jot.py"]

[tool.hatch.build.targets.sdist]
include = ["jot.py", "domains.md", "README.md", ".env.example"]
